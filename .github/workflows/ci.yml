name: CI

# Merge gates for the cap monorepo (plan item P0-2 in
# boilerplate/analysis/production-launch-readiness.md).
#
# Every PR and every push to a release branch (main / develop) runs the full
# matrix below.
#
#   Job          Status (2026-08-31)                        Notes
#   ----------   --------------------------------------    ------------------------
#   type-check   BLOCKING                                   Promoted 2026-08-31
#   lint         continue-on-error                          Pending: repo EOL normalisation (~5.9k CRLF)
#   build        BLOCKING                                   Promoted 2026-08-31
#   unit         BLOCKING                                   Promoted 2026-08-31
#   circular     BLOCKING                                   0 cycles (plan A6 done)
#   audit        BLOCKING                                   `pnpm audit --audit-level=high --prod`
#   e2e          continue-on-error                          Pending: backend checkout + webServer wiring
#   codeql       BLOCKING                                   SAST (Finding 6 — SOC 2 CC8.1 / ISO 27001 A.8.25)
#   secret-scan  BLOCKING                                   gitleaks over full history (Finding 6)
#
# To promote remaining jobs: delete `continue-on-error: true` and add the job to
# the repository's required status checks (Settings > Branches).

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  type-check:
    name: type-check (all packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm -r run type-check

  lint:
    name: lint (all packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - name: Run lint
        continue-on-error: true # PROMOTE: plan A4 / A5 + repo EOL normalisation
        run: pnpm -r run lint

  build:
    name: build (@cap/app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm --filter @cap/app run build

  unit:
    name: unit tests (all packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm -r run test

  circular:
    name: circular deps (madge)
    runs-on: ubuntu-latest
    # BLOCKING (plan A6 done): 0 cycles. `.madgerc` skips `import type` edges, which
    # are compile-erased and cannot cause init-order failures, so this flags only
    # real value cycles.
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm run lint:circular

  audit:
    name: dependency audit (prod, high+)
    runs-on: ubuntu-latest
    # BLOCKING: fails the build on any high/critical advisory in the production
    # dependency tree. Dev-only tooling (eslint, vitest, lighthouse/@lhci, madge,
    # vite-plugin-pwa) is excluded by `--prod`; residual dev-only advisories with
    # no upstream fix are pinned in package.json > pnpm.auditConfig.ignoreGhsas.
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm run audit:ci

  e2e:
    name: e2e (Playwright + live backend)
    runs-on: ubuntu-latest
    # SCAFFOLD: this wires the service containers and the backend checkout, but
    # the run is not green yet. B2 owns aligning the backend env with
    # Authentication/.env.test and fixing the playwright webServer paths
    # (app/playwright.config.ts hard-codes `../../../Authentication`).
    services:
      mysql:
        image: mysql:9.5
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: auth_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      NODE_ENV: test
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: root
      DB_DATABASE: auth_test
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      VITE_API_URL: http://localhost:3333/api
    steps:
      - name: Check out frontend
        uses: actions/checkout@v4

      - name: Check out auth backend
        continue-on-error: true # Needs secrets.AUTH_SERVICE_REPO_TOKEN
        uses: actions/checkout@v4
        with:
          repository: Serafort/serafort-auth-service
          token: ${{ secrets.AUTH_SERVICE_REPO_TOKEN }}
          path: Authentication

      - uses: ./.github/actions/setup-node-pnpm

      - name: Install backend dependencies
        continue-on-error: true
        if: hashFiles('Authentication/package.json') != ''
        working-directory: Authentication
        run: npm ci

      - name: Backend migrate + seed
        continue-on-error: true
        if: hashFiles('Authentication/package.json') != ''
        working-directory: Authentication
        run: |
          cp .env.test .env
          node ace migration:run --force
          node ace db:seed

      - name: Install Playwright browsers
        continue-on-error: true
        run: pnpm --filter @cap/app exec playwright install --with-deps chromium

      - name: Run E2E suite
        continue-on-error: true # PROMOTE: plan B2
        run: pnpm --filter @cap/app run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  # ── Finding 6 (SOC 2 CC8.1 / CC7.1, ISO 27001 A.8.25, A.8.28) ──
  # Every job above scans dependencies (audit) or types/tests/bundling — none
  # of them scan first-party source for injection or access-control bugs, and
  # nothing scans commit history for a leaked credential. Mirrors the same two
  # jobs added to serafort-auth-service.
  codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # security-extended adds the injection / access-control queries;
          # the default suite alone is too narrow for an app with an
          # authorization-engine and identity-broker module.
          queries: security-extended
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans commit history, not just the working tree — a
          # shallow checkout silently finds nothing.
          fetch-depth: 0
      # Run the MIT-licensed CLI directly rather than gitleaks-action, which
      # requires a paid licence key for organisation-owned repositories.
      - name: Scan repository history for committed secrets
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks:latest \
            detect --source=/repo --redact --verbose \
            --config=/repo/.gitleaks.toml \
            --report-format=sarif --report-path=/repo/gitleaks.sarif
      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore
