<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0d12" />
    <!-- Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <!-- Security Headers (Audit Finding 4.8) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!--
      Content-Security-Policy fallback. The authoritative policy (including
      frame-ancestors and Strict-Transport-Security, which cannot be set via
      <meta>) is delivered as real HTTP headers by the host/CDN — see
      app/public/_headers and the `headers` blocks in vite.config.ts.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline'; connect-src 'self' https:; worker-src 'self' blob:; frame-src 'self'"
    />
    <!-- Anti-flash: critical styles applied before any JS runs to prevent FOUC -->
    <style>
      /* Prevent white flash on dark-mode users before MUI theme loads */
      html.dark,
      html.dark body {
        background-color: #0d0d12;
        color-scheme: dark;
      }
      html.light,
      html.light body {
        background-color: #ffffff;
        color-scheme: light;
      }
      /* Prevent layout shift during Zustand hydration */
      #root {
        min-height: 100vh;
      }
    </style>
    <!-- Inline tenant config: injected by server/CDN edge for zero-flash -->
    <script>
      window.__TENANT_CONFIG__ = null;
    </script>
    <!-- Anti-flash: resolve color scheme before React hydrates -->
    <script>
      ;(function () {
        try {
          var cookieName = 'GLDeveloper-1'
          var match = document.cookie.match(new RegExp('(?:^|; )' + cookieName + '=([^;]*)'))
          var settings = match ? JSON.parse(decodeURIComponent(match[1])) : null
          var mode = settings && settings.mode ? settings.mode : 'light'
          if (mode === 'system') {
            mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.classList.add(mode)
          document.body && (document.body.style.colorScheme = mode)
        } catch (e) {}
      })()
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="CAP — Multi-tenant SaaS platform boilerplate built with React 19, TypeScript, and Material UI. Modular, themeable, and production-ready." />
    <title>CAP Platform</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
