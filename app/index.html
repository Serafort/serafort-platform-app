<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicons (Serafort brand kit) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/brand/logo/icon-color.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/favicon/app-icon-180.png" />
    <meta name="theme-color" content="#031433" />

    <!-- Fonts: Inter (body), Space Grotesk (display), JetBrains Mono (code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Security Headers (Audit Finding 4.8) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!--
      Content-Security-Policy fallback. The authoritative policy (including
      frame-ancestors and Strict-Transport-Security, which cannot be set via
      <meta>) is delivered as real HTTP headers by the host/CDN — see
      app/public/_headers and the `headers` blocks in vite.config.ts.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline'; connect-src 'self' https:; worker-src 'self' blob:; frame-src 'self'"
    />
    <!-- Anti-flash: critical styles applied before any JS runs to prevent FOUC -->
    <style>
      /* Prevent white flash on dark-mode users before MUI theme loads.
         #031433 is the Serafort brand ink -- keep in sync with
         semanticSurfaces.dark.canvas in @cap/theme.

         The literals are fallbacks only. --canvas-bg is set twice: by the
         script below from the theme the user saved (so a reload does not
         flash Serafort's colours before the saved theme lands), and then by
         ThemeBridge from the composed palette. Going through a variable
         rather than overriding these rules is deliberate - `html.dark body`
         outranks anything the runtime can reasonably write, and with
         `injectFirst` emotion's stylesheet sits above this block anyway, so
         an override would lose both contests. */
      html.dark,
      html.dark body {
        background-color: var(--canvas-bg, #031433);
        color-scheme: dark;
      }
      html.light,
      html.light body {
        background-color: var(--canvas-bg, #ffffff);
        color-scheme: light;
      }
      /* Prevent layout shift during Zustand hydration */
      #root {
        min-height: 100vh;
      }
    </style>
    <!-- Inline tenant config: injected by server/CDN edge for zero-flash -->
    <script>
      window.__TENANT_CONFIG__ = null;
    </script>
    <!-- Anti-flash: resolve color scheme before React hydrates -->
    <script>
      ;(function () {
        try {
          // Must match themeConfig.settingsCookieName in @cap/theme, which is
          // what getSettingsFromCookie() reads after React boots.
          var cookieName = 'serafort-settings'
          var match = document.cookie.match(new RegExp('(?:^|; )' + cookieName + '=([^;]*)'))
          var settings = match ? JSON.parse(decodeURIComponent(match[1])) : null
          var mode = settings && settings.mode ? settings.mode : 'light'
          if (mode === 'system') {
            mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.classList.add(mode)
          document.body && (document.body.style.colorScheme = mode)

          // The theme the user saved (savedThemeStore in @cap/theme). Applying
          // its page colour here is what stops a saved theme from flashing the
          // Serafort default on every reload. Only the mode it was authored in
          // is honoured - a dark theme's canvas under a light shell would be
          // worse than the fallback.
          var savedRaw = window.localStorage.getItem('serafort-theme-config')
          var saved = savedRaw ? JSON.parse(savedRaw) : null
          var config = saved && saved.config
          var savedMode = (config && config.metadata && config.metadata.mode) || 'light'
          var canvas =
            config && config.tokens && config.tokens.colors && config.tokens.colors.background
              ? config.tokens.colors.background.value
              : null
          if (canvas && savedMode === mode) {
            document.documentElement.style.setProperty('--canvas-bg', canvas)
          }
        } catch (e) {}
      })()
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Serafort — continuous identity verification and adaptive access control. Multi-tenant platform built with React 19, TypeScript, and Material UI."
    />

    <!-- Open Graph (Serafort brand kit) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Serafort" />
    <meta property="og:title" content="Serafort — Every identity, verified in real time." />
    <meta
      property="og:description"
      content="Continuous identity verification and adaptive access control for security teams who can't wait for the audit to find the problem."
    />
    <meta property="og:url" content="https://serafort.com/" />
    <meta property="og:image" content="https://serafort.com/brand/social/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Serafort — Every identity, verified in real time." />
    <meta
      name="twitter:description"
      content="Continuous identity verification and adaptive access control for security teams."
    />
    <meta name="twitter:image" content="https://serafort.com/brand/social/og-image.png" />

    <title>Serafort</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
