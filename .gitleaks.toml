# gitleaks configuration — Finding 6 (ISO 27001 A.8.25 / SOC 2 CC8.1)
#
# Extends the upstream default ruleset rather than replacing it, so new
# provider rules arrive with each gitleaks release.
[extend]
useDefault = true

[allowlist]
description = "Non-secrets that trip the default rules"
paths = [
  '''\.env\.example$''',
  '''\.env\.production\.example$''',
  '''(pnpm|package)-lock\.(yaml|json)$''',
  '''(^|/)(app/)?playwright-report/''',
  '''(^|/)(app/)?test-results/''',
  '''(^|/)docs/''',
]
# VITE_SENTRY_DSN and similar placeholders in the example env files, plus the
# generic "looks like a key but is a name" false positives that a monorepo full
# of *_ENABLED / *_KEY-suffixed identifiers tends to produce.
regexes = [
  '''VITE_SENTRY_DSN=\s*$''',
  '''(?i)(your|example|placeholder|changeme|dummy|sample)[-_]?(key|secret|token|password|dsn)''',
]
